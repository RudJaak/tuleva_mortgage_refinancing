server:
  port: 9000

spring:
  application:
    name: mortgage-pool
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/mortgage-pool
    username: mortgage-pool
    password: mortgage-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    # Logs the data file name, which contains the IBAN, when a sealed statement fails its digest check
    org.apache.xml.security.signature.Reference: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

app:
  auth:
    # Emulated Smart-ID / Mobile-ID: the verification code is shown this long, then a short
    # verifying step
    stub-code-display: 10s
    stub-verifying: 2s
    # Real names from the public eID certificate directories (docs/research/10). Exact personal
    # codes only, never logged, rate-limited so the demo is not a name oracle
    name-lookup:
      enabled: ${DEMO_NAME_LOOKUP:true}
      timeout: 3s
      max-lookups: 30
      window: 1m
      directories:
        - url: ldaps://esteid.ldap.sk.ee:636
          base: c=EE
        - url: ldaps://ldap.eidpki.ee:636
          base: dc=ldap,dc=eidpki,dc=ee
  extraction:
    mode: ${EXTRACTION_MODE:stub}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-5-5
      effort: medium
      max-tokens: 16000
  cors:
    allowed-origins: http://localhost:5173
  pool:
    # D31: a month-long campaign, counted in people. Placeholder thresholds and margins until
    # teammates confirm them (D18)
    deadline: 2026-11-10T00:00:00+02:00
    minimum-members: 1000
    privacy-threshold: 10
    milestones:
      - members: 1000
        margin: 1.35
      - members: 2500
        margin: 1.30
      - members: 5000
        margin: 1.20
  calculator:
    euribor6m: 2.936
    euribor-date: 2026-10-08
    default-margin: 1.70
    market-average-margin: 1.60
    switching-cost: 400
    annual-discount-rate: 3
    # Joining the pool requires Tuleva membership (D32); members have already paid it
    membership-fee: 150
  demo:
    seed-enabled: ${DEMO_SEED:true}
    # Every login starts the flow over (the stub login always signs in the same person)
    fresh-start-on-login: ${DEMO_FRESH_LOGIN:true}
    seed-borrowers: 520
    seed-volume: 60000000
    # Adds an in-memory "joiner" to the tracker at random intervals; resets on restart
    simulated-joiners:
      enabled: ${DEMO_LIVE:true}
      min-interval: 15s
      max-interval: 45s
      min-balance: 100000
      max-balance: 350000
  statements:
    # Off only to study old statements: no staleness flag, and the whole period is analysed
    recency-checks: ${STATEMENT_RECENCY_CHECKS:true}
  membership:
    # Emulated Tuleva membership check (D32): every demo login is a member
    stub-member: true
    stub-delay: 1500ms
  credit-check:
    # Emulated Creditinfo payment-default query (D32): run after the documents, with consent
    stub-delay: 2s
  documents:
    # Statements only (contracts are signed by people). Off: a missing or untrusted seal only
    # lowers the verification level
    require-bank-seal: ${REQUIRE_BANK_SEAL:false}
    # Banks whose digital seal we accept on a statement container, matched on the seal
    # certificate's organizationIdentifier (NTREE-<registry code>). Codes checked in e-Äriregister.
    trusted-banks:
      - name: Swedbank
        registry-code: "10060701"
      - name: SEB
        registry-code: "10004252"
      - name: LHV
        registry-code: "10539549"
      - name: Luminor
        registry-code: "11315936"
      - name: Coop Pank
        registry-code: "10237832"
      - name: Bigbank
        registry-code: "10183757"
      - name: Inbank
        registry-code: "12001988"
