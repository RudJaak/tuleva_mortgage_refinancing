server:
  port: 9000

spring:
  application:
    name: mortgage-pool
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/mortgage-pool
    username: mortgage-pool
    password: mortgage-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    # Logs the data file name, which contains the IBAN, when a sealed statement fails its digest check
    org.apache.xml.security.signature.Reference: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

app:
  auth:
    mode: ${AUTH_MODE:stub}
    stub-delay: 3s
    stub-person:
      personal-code: "40504040001"
      first-name: Mari
      last-name: Maasikas
  extraction:
    mode: ${EXTRACTION_MODE:stub}
  cors:
    allowed-origins: http://localhost:5173
  pool:
    deadline: 2026-12-31T23:59:59+02:00
    minimum-volume: 100000000
    privacy-threshold: 10
    milestones:
      - volume: 100000000
        margin: 1.20
      - volume: 300000000
        margin: 1.00
      - volume: 500000000
        margin: 0.80
  calculator:
    euribor6m: 2.936
    euribor-date: 2026-10-08
    default-margin: 1.70
    market-average-margin: 1.60
    switching-cost: 400
    annual-discount-rate: 3
  demo:
    seed-enabled: ${DEMO_SEED:true}
    seed-borrowers: 520
    seed-volume: 60000000
  statement:
    # Banks whose digital seal we accept on a statement container, matched on the seal
    # certificate's organizationIdentifier (NTREE-<registry code>). Codes checked in e-Äriregister.
    trusted-banks:
      - name: Swedbank
        registry-code: "10060701"
      - name: SEB
        registry-code: "10004252"
      - name: LHV
        registry-code: "10539549"
      - name: Luminor
        registry-code: "11315936"
      - name: Coop Pank
        registry-code: "10237832"
      - name: Bigbank
        registry-code: "10183757"
      - name: Inbank
        registry-code: "12001988"
