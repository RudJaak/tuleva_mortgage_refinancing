server:
  port: 9000

spring:
  application:
    name: mortgage-pool
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/mortgage-pool
    username: mortgage-pool
    password: mortgage-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

app:
  auth:
    mode: ${AUTH_MODE:stub}
  extraction:
    mode: ${EXTRACTION_MODE:stub}
  cors:
    allowed-origins: http://localhost:5173
  pool:
    deadline: 2026-12-31T23:59:59+02:00
    minimum-volume: 100000000
    privacy-threshold: 10
    milestones:
      - volume: 100000000
        margin: 1.20
      - volume: 300000000
        margin: 1.00
      - volume: 500000000
        margin: 0.80
  calculator:
    euribor6m: 2.936
    euribor-date: 2026-10-08
    default-margin: 1.70
    market-average-margin: 1.60
    switching-cost: 400
    annual-discount-rate: 3
  demo:
    seed-enabled: ${DEMO_SEED:true}
    seed-borrowers: 520
    seed-volume: 60000000
